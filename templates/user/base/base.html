{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Zitarra{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { orange:'#E8500A', cream:'#F5F0EB', dark:'#1A1A1A' }
          },
          fontFamily: { sans: ['Inter','sans-serif'] },
          keyframes: {
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%, 60%': { transform: 'translateX(-5px)' },
              '40%, 80%': { transform: 'translateX(5px)' }
            },
            ripple: {
              'to': { transform: 'scale(4)', opacity: '0' }
            },
            iconBounce: {
              '0%': { transform: 'scale(0)' },
              '50%': { transform: 'scale(1.15)' },
              '100%': { transform: 'scale(1)' }
            },
            fadeInUp: {
              'from': { opacity: '0', transform: 'translateY(15px)' },
              'to': { opacity: '1', transform: 'translateY(0)' }
            }
          },
          animation: {
            shake: 'shake 0.4s ease-in-out',
            ripple: 'ripple 0.55s linear',
            iconBounce: 'iconBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55)',
            fadeInUp: 'fadeInUp 0.75s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="{% static 'css/styles.css' %}" />

  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans">

  <!-- ── Navbar injected per-page via block navbar ── -->
  {% block navbar %}
    {% include 'user/partials/navbar.html' %}
  {% endblock %}

  {% block content %}{% endblock %}

  <!-- ── Global Navbar JS ── -->
  <script>
    (function(){
      const nav = document.getElementById('nav');
      const links = document.querySelectorAll('.n-links a');

      /* scroll: dark glass + scroll-spy */
      window.addEventListener('scroll', function(){
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 10);
      }, { passive: true });

      /* click: move active underline */
      links.forEach(function(link){
        link.addEventListener('click', function(){
          links.forEach(function(l){ l.classList.remove('act'); });
          link.classList.add('act');
        });
      });

      function triggerLoadingBar(color) {
        if (document.getElementById('top-loading-bar')) return;
        const bar = document.createElement('div');
        bar.id = 'top-loading-bar';
        bar.className = 'fixed top-0 left-0 h-[3px] z-[99999] w-0 transition-all duration-400 ease-out bg-[#E8500A]';
        document.body.appendChild(bar);
        setTimeout(() => { bar.classList.replace('w-0', 'w-[30%]'); }, 50);
        setTimeout(() => { bar.classList.replace('w-[30%]', 'w-[60%]'); }, 400);
        setTimeout(() => { bar.classList.replace('w-[60%]', 'w-[85%]'); }, 900);
        setTimeout(() => { bar.classList.replace('w-[85%]', 'w-[95%]'); }, 1800);
      }

      document.addEventListener('submit', function(e) {
        if (!e.defaultPrevented) {
          triggerLoadingBar('#E8500A');
        }
      });

      document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (link && link.href && link.href.includes('/google/login/')) {
          triggerLoadingBar('#E8500A');
        }
      });

      window.addEventListener('pageshow', function(event) {
        const bar = document.getElementById('top-loading-bar');
        if (bar) {
          bar.remove();
        }
      });

      // ── Auto-hide alert messages globally after 3 seconds ──
      function initAutoDismissAlerts() {
        setTimeout(function() {
          const alerts = document.querySelectorAll('.msg-alert, .alert-auto-dismiss');
          alerts.forEach(function(el) {
            if (el.closest('form') || el.closest('.modal')) return;
            el.style.transition = 'opacity 0.5s ease, transform 0.5s ease, max-height 0.5s ease, margin 0.5s ease, padding 0.5s ease';
            el.style.opacity = '0';
            el.style.transform = 'translateY(-10px)';
            setTimeout(function() {
              el.style.maxHeight = '0';
              el.style.padding = '0';
              el.style.margin = '0';
              el.style.border = 'none';
              setTimeout(function() { el.remove(); }, 500);
            }, 300);
          });
        }, 3000);
      }
      document.addEventListener('DOMContentLoaded', initAutoDismissAlerts);

      // ── Custom Dropdown Auto-Converter ──
      function initCustomDropdowns() {
        const selects = document.querySelectorAll('select:not(.custom-select-processed)');
        selects.forEach(select => {
          if (select.classList.contains('hidden') || select.style.display === 'none') {
            return;
          }
          select.classList.add('custom-select-processed');

          const parent = select.parentElement;
          const isParentRelative = parent && parent.classList.contains('relative');

          // Hide original select in a focusable way so HTML5 validation still works
          select.style.position = 'absolute';
          select.style.opacity = '0';
          select.style.width = '0';
          select.style.height = '0';
          select.style.overflow = 'hidden';
          select.style.pointerEvents = 'none';

          // Hide default sibling arrows in the templates (e.g. pointer-events-none elements)
          if (parent) {
            const arrowSiblings = parent.querySelectorAll('.pointer-events-none');
            arrowSiblings.forEach(arrow => {
              arrow.style.display = 'none';
            });
          }

          // Create custom trigger button
          const button = document.createElement('button');
          button.type = 'button';
          button.className = select.className.replace(/appearance-none/g, '') + ' flex items-center justify-between w-full text-left';
          if (select.classList.contains('border-none')) {
            button.classList.add('border-none');
          }
          button.style.display = 'flex';

          // Set initial label
          const selectedOption = select.options[select.selectedIndex] || select.options[0];
          const labelSpan = document.createElement('span');
          labelSpan.className = 'selected-text truncate mr-2';
          labelSpan.textContent = selectedOption ? selectedOption.textContent.trim() : '';
          button.appendChild(labelSpan);

          // Add arrow icon
          const arrowSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          arrowSvg.setAttribute('class', 'w-3.5 h-3.5 text-gray-400 transition-transform duration-200 shrink-0 ml-auto');
          arrowSvg.setAttribute('fill', 'none');
          arrowSvg.setAttribute('viewBox', '0 0 24 24');
          arrowSvg.setAttribute('stroke', 'currentColor');
          arrowSvg.setAttribute('stroke-width', '2');
          arrowSvg.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />';
          button.appendChild(arrowSvg);

          // Create menu container
          const menu = document.createElement('div');
          menu.className = 'custom-select-menu absolute left-0 right-0 mt-1 bg-white border border-[#e2e2e2] shadow-lg max-h-60 overflow-y-auto hidden z-[999]';
          
          const rebuildItems = () => {
            menu.innerHTML = '';
            
            // Prepend Search Bar for Large Lists (5+ options)
            if (select.options.length > 5) {
              const searchWrapper = document.createElement('div');
              searchWrapper.className = 'sticky top-0 bg-white p-2 border-b border-gray-100 z-10';
              
              const searchInput = document.createElement('input');
              searchInput.type = 'text';
              searchInput.placeholder = 'Search options...';
              searchInput.className = 'w-full border border-gray-300 px-3 py-1.5 text-[0.62rem] font-medium uppercase tracking-wider text-brand-dark bg-white outline-none focus:border-brand-rust';
              
              // Prevent input click from closing the dropdown menu
              searchInput.addEventListener('click', (e) => e.stopPropagation());
              
              // Listen to typing to filter dropdown items
              searchInput.addEventListener('input', () => {
                const filter = searchInput.value.toLowerCase();
                const items = menu.querySelectorAll('.custom-select-item');
                items.forEach(item => {
                  const text = item.textContent.toLowerCase();
                  if (text.includes(filter)) {
                    item.style.display = 'block';
                  } else {
                    item.style.display = 'none';
                  }
                });
              });
              
              searchWrapper.appendChild(searchInput);
              menu.appendChild(searchWrapper);
            }

            Array.from(select.options).forEach((option) => {
              const item = document.createElement('div');
              item.className = 'custom-select-item px-5 py-2.5 text-[0.62rem] font-bold tracking-[0.15em] uppercase text-gray-500 hover:bg-orange-50 hover:text-[#A33C08] cursor-pointer transition-colors duration-150';
              if (option.selected) {
                item.classList.add('bg-orange-50', 'text-[#A33C08]', 'active');
              }
              item.textContent = option.textContent.trim();
              item.setAttribute('data-value', option.value);

              item.addEventListener('click', (e) => {
                e.stopPropagation();
                select.value = option.value;
                labelSpan.textContent = option.textContent.trim();

                menu.querySelectorAll('.custom-select-item').forEach(i => i.classList.remove('bg-orange-50', 'text-[#A33C08]', 'active'));
                item.classList.add('bg-orange-50', 'text-[#A33C08]', 'active');

                menu.classList.add('hidden');
                arrowSvg.classList.remove('rotate-180');

                // Trigger change event
                select.dispatchEvent(new Event('change', { bubbles: true }));
              });

              menu.appendChild(item);
            });
          };

          rebuildItems();

          // Monitor original select changes (e.g. if updated via javascript)
          select.addEventListener('change', () => {
            const currentOption = select.options[select.selectedIndex];
            if (currentOption) {
              labelSpan.textContent = currentOption.textContent.trim();
              menu.querySelectorAll('.custom-select-item').forEach(i => {
                if (i.getAttribute('data-value') === select.value) {
                  i.classList.add('bg-orange-50', 'text-[#A33C08]', 'active');
                } else {
                  i.classList.remove('bg-orange-50', 'text-[#A33C08]', 'active');
                }
              });
            }
          });

          // Toggle menu
          button.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.custom-select-menu').forEach(m => {
              if (m !== menu) {
                m.classList.add('hidden');
                const btn = m.previousElementSibling;
                if (btn) {
                  const arr = btn.querySelector('svg');
                  if (arr) arr.classList.remove('rotate-180');
                }
              }
            });
            menu.classList.toggle('hidden');
            arrowSvg.classList.toggle('rotate-180');

            // Auto-focus and Reset Search Input when Opened
            if (!menu.classList.contains('hidden')) {
              const searchInput = menu.querySelector('input');
              if (searchInput) {
                searchInput.value = ''; // Clear previous searches
                searchInput.dispatchEvent(new Event('input')); // Reset item filters
                setTimeout(() => searchInput.focus(), 50); // Small timeout to wait for block render
              }
            }
          });

          // Insert custom elements
          if (isParentRelative) {
            parent.appendChild(button);
            parent.appendChild(menu);
          } else {
            const wrapper = document.createElement('div');
            wrapper.className = 'relative w-full';
            select.parentNode.insertBefore(wrapper, select);
            wrapper.appendChild(select);
            wrapper.appendChild(button);
            wrapper.appendChild(menu);
          }
        });
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', () => {
        initCustomDropdowns();
        
        document.addEventListener('click', () => {
          document.querySelectorAll('.custom-select-menu').forEach(m => m.classList.add('hidden'));
          document.querySelectorAll('button svg').forEach(svg => svg.classList.remove('rotate-180'));
        });

        const observer = new MutationObserver(() => {
          initCustomDropdowns();
        });
        observer.observe(document.body, { childList: true, subtree: true });
      });
    })();
  </script>

</body>
</html>
