<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Zitarra{% endblock %}</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { orange:'#E8500A', cream:'#F5F0EB', dark:'#1A1A1A' }
          },
          fontFamily: { sans: ['Inter','sans-serif'] },
          keyframes: {
            shake: {
              '0%, 100%': { transform: 'translateX(0)' },
              '20%, 60%': { transform: 'translateX(-5px)' },
              '40%, 80%': { transform: 'translateX(5px)' }
            },
            ripple: {
              'to': { transform: 'scale(4)', opacity: '0' }
            },
            iconBounce: {
              '0%': { transform: 'scale(0)' },
              '50%': { transform: 'scale(1.15)' },
              '100%': { transform: 'scale(1)' }
            }
          },
          animation: {
            shake: 'shake 0.4s ease-in-out',
            ripple: 'ripple 0.55s linear',
            iconBounce: 'iconBounce 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55)'
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* Hide scrollbar for Chrome, Safari and Opera */
    ::-webkit-scrollbar {
      display: none;
    }
    /* Hide scrollbar for IE, Edge and Firefox */
    html {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
/* Premium Restyling of Global Alert Messages (Sleek Accent Pill) */
    .msg-alert {
      display: inline-flex !important;
      align-items: center !important;
      gap: 10px !important;
      width: fit-content !important;
      max-width: 100% !important;
      padding: 12px 24px !important;
      border-radius: 9999px !important; /* Pill style */
      font-size: 0.65rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.08em !important;
      text-transform: uppercase !important;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
      margin-bottom: 24px !important;
      opacity: 0;
      transform: scale(0.95);
      animation: scaleInPill 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards !important;
      transition: opacity 0.4s ease, transform 0.4s ease !important;

      /* Lock dimension and layout properties to prevent squishing when JS auto-hide shrinks them */
      max-height: none !important;
      height: auto !important;
      padding: 12px 24px !important;
      margin-bottom: 24px !important;
      border-width: 1px !important;
    }

    .msg-alert svg {
      width: 16px !important;
      height: 16px !important;
      flex-shrink: 0 !important;
    }

    /* Success Pill custom styling (Zitarra Premium Dark & Orange Accent) */
    .msg-alert.border-green-500 {
      border: 1px solid rgba(232, 80, 10, 0.3) !important; /* Zitarra brand orange border */
      background: #1A1A1A !important; /* Zitarra brand dark background */
      color: #FFFFFF !important;
    }
    .msg-alert.border-green-500 svg {
      color: #E8500A !important; /* Brand orange icon */
    }

    /* Error Pill custom styling (Zitarra Premium Dark & Red Accent) */
    .msg-alert.border-red-500 {
      border: 1px solid rgba(239, 68, 68, 0.35) !important;
      background: #1A1A1A !important;
      color: #FFFFFF !important;
    }
    .msg-alert.border-red-500 svg {
      color: #EF4444 !important;
    }

    @keyframes scaleInPill {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="font-sans">

  <!-- ── Navbar injected per-page via block navbar ── -->
  {% block navbar %}
    {% include 'user/partials/navbar.html' %}
  {% endblock %}

  {% block content %}{% endblock %}

  <!-- ── Global Navbar JS ── -->
  <script>
    (function(){
      const nav = document.getElementById('nav');
      const links = document.querySelectorAll('.n-links a');

      /* scroll: dark glass + scroll-spy */
      window.addEventListener('scroll', function(){
        if (nav) nav.classList.toggle('scrolled', window.scrollY > 10);
      }, { passive: true });

      /* click: move active underline */
      links.forEach(function(link){
        link.addEventListener('click', function(){
          links.forEach(function(l){ l.classList.remove('act'); });
          link.classList.add('act');
        });
      });

      function triggerLoadingBar(color) {
        if (document.getElementById('top-loading-bar')) return;
        const bar = document.createElement('div');
        bar.id = 'top-loading-bar';
        bar.style.cssText = 'position:fixed;top:0;left:0;height:3px;z-index:99999;width:0%;transition:width 0.4s ease-out;background-color:' + color;
        document.body.appendChild(bar);
        setTimeout(() => { bar.style.width = '30%'; }, 50);
        setTimeout(() => { bar.style.width = '60%'; }, 400);
        setTimeout(() => { bar.style.width = '85%'; }, 900);
        setTimeout(() => { bar.style.width = '95%'; }, 1800);
      }

      document.addEventListener('submit', function(e) {
        if (!e.defaultPrevented) {
          triggerLoadingBar('#E8500A');
        }
      });

      document.addEventListener('click', function(e) {
        const link = e.target.closest('a');
        if (link && link.href && link.href.includes('/google/login/')) {
          triggerLoadingBar('#E8500A');
        }
      });
    })();
  </script>

</body>
</html>
