<header id="nav"
  class="sticky top-0 z-[200] bg-white border-b border-gray-200 flex items-center justify-between px-8 h-[60px] transition-all duration-300 group [&.scrolled]:bg-[#0a0a0a]/70 [&.scrolled]:border-transparent [&.scrolled]:backdrop-blur-[18px]">

  <!-- Logo (left) -->
  <div class="flex-shrink-0">
    <a href="/home/"
      class="text-2xl font-black tracking-[0.22em] uppercase text-brand-dark no-underline group-[.scrolled]:text-white transition-colors duration-300">Zitarra</a>
  </div>

  <!-- Nav links (center) -->
  <nav id="nav-links"
    class="absolute left-1/2 transform -translate-x-1/2 flex gap-7 n-links transition-all duration-200">
    <a href="/home/"
      class="text-[0.68rem] font-bold tracking-[0.14em] uppercase text-brand-dark no-underline relative pb-[3px] transition-colors hover:text-[#E8500A] group-[.scrolled]:text-gray-400 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-[#E8500A] after:transition-all after:duration-250 hover:after:w-full">Home</a>
    <a href="/shop/"
      class="text-[0.68rem] font-bold tracking-[0.14em] uppercase text-[#E8500A] no-underline relative pb-[3px] after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-full after:h-[2px] after:bg-[#E8500A]">Shop</a>
    <a href="/home/#about"
      class="text-[0.68rem] font-bold tracking-[0.14em] uppercase text-brand-dark no-underline relative pb-[3px] transition-colors hover:text-[#E8500A] group-[.scrolled]:text-gray-400 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-[#E8500A] after:transition-all after:duration-250 hover:after:w-full">About
      Us</a>
    <a href="/home/#contact"
      class="text-[0.68rem] font-bold tracking-[0.14em] uppercase text-brand-dark no-underline relative pb-[3px] transition-colors hover:text-[#E8500A] group-[.scrolled]:text-gray-400 after:content-[''] after:absolute after:bottom-0 after:left-0 after:w-0 after:h-[2px] after:bg-[#E8500A] after:transition-all after:duration-250 hover:after:w-full">Contact
      Us</a>
  </nav>

  <!-- Right side: Search bar + Icons -->
  <div class="flex items-center gap-5 flex-shrink-0">

    <!-- Search bar (expands inline) -->
    <div id="search-bar" class="items-center gap-2 overflow-hidden transition-all duration-300 ease-in-out w-0 opacity-0">
      <input id="search-input" type="text" placeholder="Search instruments…"
        class="flex-1 text-[0.7rem] text-brand-dark placeholder-gray-400 border-b border-gray-300 bg-transparent outline-none pb-[2px] focus:border-[#E8500A] transition-colors tracking-wide whitespace-nowrap group-[.scrolled]:text-white group-[.scrolled]:placeholder-gray-300 group-[.scrolled]:border-gray-500 min-w-[280px]" />
      <button onclick="closeSearch()"
        class="text-gray-400 hover:text-brand-dark transition-colors shrink-0 group-[.scrolled]:text-gray-300 group-[.scrolled]:hover:text-white"
        aria-label="Close search">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <!-- Search icon (opens search bar or submits search) -->
    <button id="btn-search" onclick="handleSearch()"
      class="text-brand-dark hover:text-[#E8500A] transition-colors group-[.scrolled]:text-gray-300 outline-none cursor-pointer"
      aria-label="Search">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
    </button>
    {% if user.is_authenticated %}
    <!-- Wishlist -->
    <a href="{% url 'wishlist:wishlist_view' %}" class="relative text-brand-dark hover:text-[#E8500A] transition-colors group-[.scrolled]:text-gray-300"
      aria-label="Wishlist">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path
          d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
      </svg>
      {% if wishlist_item_count and wishlist_item_count > 0 %}
      <span class="absolute -top-1.5 -right-1.5 bg-[#E8500A] text-white text-[0.45rem] font-black w-4 h-4 rounded-full flex items-center justify-center">{{ wishlist_item_count }}</span>
      {% endif %}
    </a>
    <!-- Cart -->
    <a href="{% url 'cart_view' %}"
      class="relative text-brand-dark hover:text-[#E8500A] transition-colors group-[.scrolled]:text-gray-300"
      aria-label="Cart">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <circle cx="9" cy="21" r="1" />
        <circle cx="20" cy="21" r="1" />
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
      </svg>
      {% if cart_item_count and cart_item_count > 0 %}
      <span
        class="absolute -top-1.5 -right-1.5 bg-[#E8500A] text-white text-[0.45rem] font-black w-4 h-4 rounded-full flex items-center justify-center">{{ cart_item_count }}</span>
      {% endif %}
    </a>
    <!-- Profile -->
    <a href="{% url 'profiles:profile' %}"
      class="text-brand-dark hover:text-[#E8500A] transition-colors group-[.scrolled]:text-gray-300"
      aria-label="Profile">
      <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
        <circle cx="12" cy="7" r="4" />
      </svg>
    </a>
    {% else %}
    <!-- Login for unauthenticated users -->
    <a href="{% url 'login' %}"
      class="text-[0.62rem] font-bold tracking-[0.16em] uppercase text-[#E8500A] no-underline border-[1.5px] border-[#E8500A] px-[18px] py-[7px] transition-all duration-200 hover:bg-[#E8500A] hover:text-white group-[.scrolled]:border-[#E8500A] group-[.scrolled]:text-[#E8500A] group-[.scrolled]:hover:bg-[#E8500A] group-[.scrolled]:hover:text-white">Login</a>
    {% endif %}
  </div>
</header>

<script>
  var searchOpen = false;

  function handleSearch() {
    if (!searchOpen) {
      openSearch();
    } else {
      var query = document.getElementById('search-input').value.trim();
      if (query) {
        // Redirect to shop with search query parameter
        window.location.href = '/shop/?search=' + encodeURIComponent(query);
      }
    }
  }

  function openSearch() {
    var bar = document.getElementById('search-bar');
    bar.classList.remove('w-0', 'opacity-0');
    bar.classList.add('w-[320px]', 'opacity-100', 'flex');
    searchOpen = true;
    setTimeout(function () { document.getElementById('search-input').focus(); }, 100);
  }

  function closeSearch() {
    var bar = document.getElementById('search-bar');
    bar.classList.add('w-0', 'opacity-0');
    bar.classList.remove('w-[320px]', 'opacity-100', 'flex');
    document.getElementById('search-input').value = '';
    searchOpen = false;

    // Clear search parameter from URL if it exists
    if (window.location.search.includes('search=')) {
      var params = new URLSearchParams(window.location.search);
      params.delete('search');
      var newUrl = '/shop/' + (params.toString() ? '?' + params.toString() : '');
      window.location.href = newUrl;
    }
  }

  // Submit search on Enter key
  document.addEventListener('DOMContentLoaded', function () {
    document.getElementById('search-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        handleSearch();
      }
    });

    // Auto-open and fill search bar if active search query exists in URL
    var params = new URLSearchParams(window.location.search);
    var searchVal = params.get('search');
    if (searchVal) {
      document.getElementById('search-input').value = searchVal;
      openSearch();
    }
  });

  // Close on Escape
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeSearch();
  });

  /* scroll glass effect */
  (function(){
    var nav = document.getElementById('nav');
    window.addEventListener('scroll', function(){
      nav.classList.toggle('scrolled', window.scrollY > 10);
    }, { passive: true });
  })();
</script>
